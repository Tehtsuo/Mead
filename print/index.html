<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Batch Label</title>
<style>
  :root {
    --accent: #159957;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 2rem;
    color: #222;
  }
  h1 {
    font-size: 1.4rem;
  }
  .hint {
    color: #666;
    font-size: 0.85rem;
    max-width: 34rem;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-width: 34rem;
    margin: 1.5rem 0 2.5rem;
  }
  .controls label {
    font-weight: 600;
    font-size: 0.85rem;
  }
  .controls input,
  .controls textarea {
    font: inherit;
    padding: 0.5rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .controls textarea {
    resize: vertical;
    min-height: 5.5rem;
    line-height: 1.4;
  }
  button {
    align-self: flex-start;
    padding: 0.55rem 1.2rem;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    opacity: 0.9;
  }

  .label {
    display: flex;
    align-items: center;
    gap: 0.18in;
    width: fit-content;
    height: 1.5in;
    /* QR SVGs bake in their own quiet-zone margin (~0.185in at this size,
       measured from actual rendered pixels), so the QR's left edge already
       has built-in whitespace the text's right edge doesn't. Extra right
       padding balances the two visually. */
    padding: 0.06in 0.245in 0.06in 0.06in;
    border: 1px dashed #bbb;
  }
  .label img {
    width: 1.5in;
    height: 1.5in;
    flex: none;
  }
  .label .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 0.06in;
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.2;
    white-space: nowrap;
  }
  .label .text div:nth-child(1) {
    font-size: 0.8em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #444;
  }
  .label .text div:nth-child(2) {
    font-size: 1.15em;
    font-weight: 700;
  }

  #sheet {
    display: none;
  }

  @media print {
    body * {
      visibility: hidden;
    }
    #sheet, #sheet * {
      visibility: visible;
    }
    #sheet {
      display: grid;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    /* Shared-border grid: each cell draws only its right/bottom edge, and
       the first row/column adds the missing top/left edge, so adjoining
       labels share a single cut line instead of two lines with a gap
       between them - one pass of a straight-cutter separates both at once. */
    #sheet .label {
      box-sizing: border-box;
      margin: 0;
      /* Same left/right imbalance correction as the on-screen .label padding. */
      padding: 0.05in 0.235in 0.05in 0.05in;
      border: none;
      border-right: 1px dashed #999;
      border-bottom: 1px dashed #999;
    }
    #sheet .label.sheet-col-first {
      border-left: 1px dashed #999;
    }
    #sheet .label.sheet-row-first {
      border-top: 1px dashed #999;
    }
    @page {
      margin: 0.25in;
    }
  }
</style>
</head>
<body>
  <h1>Print a batch label</h1>
  <p class="hint">
    Adjust the text below, then Print &mdash; the page fills with as many copies of the label as
    fit. In the print dialog, set margins to "None" and turn off headers/footers for the cleanest
    cut.
  </p>

  <div class="controls">
    <label for="batch">Batch path (e.g. 2026/TRM Horizon Drift)</label>
    <input id="batch" type="text" placeholder="2026/TRM Horizon Drift">

    <label for="lines">Label text (one line each)</label>
    <textarea id="lines" rows="4"></textarea>

    <button id="printBtn" type="button">Print</button>
  </div>

  <div class="label" id="label">
    <img id="qr" alt="QR code linking to the batch page">
    <div class="text" id="text"></div>
  </div>

  <div id="sheet"></div>

  <script>
    const BRAND = "Tiki Room Meadery";
    const PAGE_WIDTH_IN = 8; // 8.5in letter width minus 0.25in margins each side
    const PAGE_HEIGHT_IN = 10.5; // 11in letter height minus 0.25in margins each side
    const params = new URLSearchParams(location.search);
    const batchInput = document.getElementById("batch");
    const linesInput = document.getElementById("lines");
    const qrImg = document.getElementById("qr");
    const textEl = document.getElementById("text");
    const labelEl = document.getElementById("label");
    const sheetEl = document.getElementById("sheet");

    function siteRoot() {
      // This page lives at <site>/print/; batches live at <site>/<year>/<name>/.
      return new URL("../", location.href);
    }

    function formatAutoLines(name, overview) {
      const lines = [BRAND, name];

      const abv = (overview["ABV"] || "").replace(/^~/, "").trim();
      const type = (overview["Type"] || "").trim();
      const descriptor = [abv && `${abv} ABV`, type].filter(Boolean).join(" ");
      if (descriptor) lines.push(descriptor);

      const bottled = (overview["Bottling date"] || "").trim();
      if (bottled) lines.push(`Bottled ${bottled}`);

      return lines;
    }

    async function autofill(batch, name) {
      try {
        const pageUrl = new URL(encodeURI(batch) + "/", siteRoot()).href;
        const res = await fetch(pageUrl);
        if (!res.ok) return;
        const doc = new DOMParser().parseFromString(await res.text(), "text/html");

        const overview = {};
        doc.querySelectorAll("table tr").forEach((tr) => {
          const cells = tr.querySelectorAll("th, td");
          if (cells.length < 2) return;
          const key = cells[0].textContent.trim();
          if (key) overview[key] = cells[1].textContent.trim();
        });

        linesInput.value = formatAutoLines(name, overview).join("\n");
        render();
      } catch (e) {
        // Batch page not reachable (offline, not deployed yet, etc.) - leave the manual default.
      }
    }

    function render() {
      const batch = batchInput.value.trim();
      qrImg.src = batch ? new URL(encodeURI(batch) + "/qr.svg", siteRoot()).href : "";

      textEl.innerHTML = "";
      linesInput.value
        .split("\n")
        .filter((line) => line.length)
        .forEach((line) => {
          const div = document.createElement("div");
          div.textContent = line;
          textEl.appendChild(div);
        });

      buildSheet();
    }

    function measurePrintLabelSize() {
      const probe = labelEl.cloneNode(true);
      probe.style.position = "fixed";
      probe.style.left = "-9999px";
      probe.style.top = "0";
      probe.style.margin = "0";
      probe.style.boxSizing = "border-box";
      probe.style.padding = "0.05in 0.235in 0.05in 0.05in";
      probe.style.border = "none";
      probe.style.borderRight = "1px dashed #999";
      probe.style.borderBottom = "1px dashed #999";
      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      document.body.removeChild(probe);
      return { width: rect.width, height: rect.height };
    }

    function buildSheet() {
      sheetEl.innerHTML = "";
      const size = measurePrintLabelSize();
      if (!size.width || !size.height) return;

      const cols = Math.max(1, Math.floor((PAGE_WIDTH_IN * 96) / size.width));
      const rows = Math.max(1, Math.floor((PAGE_HEIGHT_IN * 96) / size.height));

      sheetEl.style.gridTemplateColumns = `repeat(${cols}, ${size.width}px)`;
      sheetEl.style.gridAutoRows = `${size.height}px`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const clone = labelEl.cloneNode(true);
          if (c === 0) clone.classList.add("sheet-col-first");
          if (r === 0) clone.classList.add("sheet-row-first");
          sheetEl.appendChild(clone);
        }
      }
    }

    const batchParam = params.get("batch") || "";
    const nameParam = params.get("name") || batchParam.split("/").pop() || "";

    batchInput.value = batchParam;
    linesInput.value = [BRAND, nameParam, "", ""].join("\n");

    batchInput.addEventListener("input", render);
    batchInput.addEventListener("change", () => {
      const batch = batchInput.value.trim();
      if (batch) autofill(batch, batch.split("/").pop());
    });
    linesInput.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    render();
    if (batchParam) autofill(batchParam, nameParam);
  </script>
</body>
</html>
